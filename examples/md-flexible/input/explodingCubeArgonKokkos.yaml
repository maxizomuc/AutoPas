container                        :  [KokkosDirectSum]
data-layout                      :  [SoA]
newton3                          :  [disabled, disabled]
verlet-rebuild-frequency         :  1
verlet-skin-radius               :  0.2
verlet-cluster-size              :  8
selector-strategy                :  Fastest-Absolute-Value
traversal                        :  [ ds_kokkos_teams ]
# tuning-strategies                :  [predictive-tuning]
tuning-interval                  :  2000
tuning-samples                   :  4
functor                          :  Ab-initio Argon Kokkos
cutoff                           :  2
box-min                          :  [0, 0, 0]
box-max                          :  [70, 70, 70]
cell-size                        :  [1]
deltaT                           :  0.00182367
iterations                       :  15000
boundary-type                    : [reflective, reflective, reflective]
Sites:
  0:
    epsilon                      :  1.
    sigma                        :  1.
    mass                         :  1.
Objects:                         
  CubeClosestPacked:
    0:
      #Argon
      particle-type-id           :  0
      box-length                 :  [12, 12, 12]
      bottomLeftCorner           :  [27, 27, 27]
      particle-spacing           :  0.95
      velocity                   :  [0, 0, 0]
      particle-mass              :  39.984
no-end-config                    :  true
no-progress-bar                  :  false
vtk-filename                     :  ExplodingCubeArgonKokkos
vtk-write-frequency              :  200
vtk-output-folder                :  vtkOutputFolder
log-level                        :  info
kokkos-chunk-size                :  [128]
kokkos-team-size                 :  [128]
log-file                         :  global_test_kokkos_float_teams.txt
